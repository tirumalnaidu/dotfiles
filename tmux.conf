# ~/.tmux.conf -- tmux 3.7, prefix C-a

set -g default-shell "$HOME/.local/bin/zsh"
set -g default-command "$HOME/.local/bin/zsh -l"

# 24-bit colour. RGB must be advertised for the *outer* terminal, since tmux
# only forwards truecolour if it believes the host terminal supports it.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm*:Tc,screen*:Tc"
set -as terminal-features ",*:clipboard:usstyle"
set -g set-clipboard on       # forward copies to the system clipboard over
                              # OSC 52; the default "external" kept them
                              # inside tmux only

set -g prefix C-a
unbind C-b
bind C-a send-prefix
bind a last-window

set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10         # not 0: an arrow key arrives as ESC then '[D', and
                              # 0 dispatched the bare ESC before the rest landed,
                              # which broke prefix+arrow and Alt+arrow entirely
set -g repeat-time 400
set -g focus-events on
# VSCode exports a per-window IPC socket path. It is not in the default
# update-environment list, so the server froze one at startup and kept handing
# out that dead path long after the window closed -- `code` got ECONNREFUSED.
set -ga update-environment " VSCODE_IPC_HOOK_CLI"
set -g display-time 2000
set -g set-titles on
set -g set-titles-string "#S:#I #W"
setw -g automatic-rename on
setw -g aggressive-resize on
set -g status-interval 5

# --- panes / windows --------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind -r C-h previous-window
bind -r C-l next-window
bind Space next-layout
bind z resize-pane -Z
bind ! break-pane
bind @ join-pane -h -s !
bind r source-file ~/.tmux.conf \; display "config reloaded"
bind e setw synchronize-panes \; display "sync-panes: #{?pane_synchronized,on,off}"

# --- copy mode (vi) --------------------------------------------------------
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind / copy-mode \; send ?
bind p paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear

# --- help ------------------------------------------------------------------
# list-keys moves off "?" to B: binding a literal "??" would make every single
# "?" sit waiting for a second press before drawing the popup.
bind ? display-popup -E -w 80% -h 85% "less -R ~/.tmux-cheatsheet.md"
bind B list-keys -N

# --- session picker --------------------------------------------------------
bind S choose-tree -Zs
bind X confirm-before -p "kill session #S? (y/n)" kill-session

# --- status line -----------------------------------------------------------
set -g status-position bottom
set -g status-style "bg=colour236,fg=colour250"
set -g status-left-length 40
set -g status-right-length 90
set -g status-left "#[bg=colour31,fg=colour255,bold] #S #[bg=colour236,fg=colour31,nobold] "
set -g status-right "#[fg=colour245]#{?pane_synchronized,SYNC ,}#{?client_prefix,^A ,}#[fg=colour250]%H:%M #[bg=colour31,fg=colour255,bold] #h "
setw -g window-status-format " #I:#W#{?window_zoomed_flag,+,} "
setw -g window-status-current-format "#[bg=colour24,fg=colour255,bold] #I:#W#{?window_zoomed_flag,+,} "
setw -g window-status-separator ""
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour31"
set -g message-style "bg=colour31,fg=colour255"
set -g mode-style "bg=colour24,fg=colour255"
