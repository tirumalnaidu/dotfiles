# Starship prompt — minimal, clean, fast
# Docs: https://starship.rs/config

# Keep it tight — just the essentials
add_newline = true

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "

[git_status]
style = "bold yellow"

[python]
symbol = " "

[nodejs]
symbol = " "

[cmd_duration]
min_time = 2000
show_milliseconds = false

[username]
show_always = false

[hostname]
ssh_only = true
